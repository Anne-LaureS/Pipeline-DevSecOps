<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Deux événements GitHub Actions obtiennent chacun un jeton OIDC avec un sub différent ; l'IAM Provider AWS ne laisse ce sub assumer que le rôle correspondant — une pull request ne peut jamais atteindre le rôle d'écriture.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>

    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Trigger: pull_request -->
  <rect x="20" y="40" width="210" height="80" rx="10" fill="url(#gBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="44" cy="60" r="11" fill="#1d4ed8"/>
  <circle cx="39" cy="55" r="2.6" fill="#eff6ff"/>
  <circle cx="39" cy="65" r="2.6" fill="#eff6ff"/>
  <circle cx="49" cy="60" r="2.6" fill="#eff6ff"/>
  <path d="M39,57.6 L39,62.4 M41.2,60 L46.6,60" stroke="#eff6ff" stroke-width="1.3" fill="none"/>
  <text x="125" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">Pull request</text>
  <text x="125" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">depuis n'importe quel</text>
  <text x="125" y="101" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">fork / branche</text>

  <!-- Trigger: push main -->
  <rect x="20" y="400" width="210" height="80" rx="10" fill="url(#gBlue)" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="44" cy="420" r="11" fill="#1d4ed8"/>
  <path d="M44,414 L44,426 M39,419 L44,414 L49,419" stroke="#eff6ff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">Push sur main</text>
  <text x="125" y="446" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">après review +</text>
  <text x="125" y="461" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">merge de la PR</text>

  <!-- OIDC provider hub -->
  <rect x="370" y="220" width="240" height="100" rx="10" fill="url(#gSlate)" stroke="#334155" stroke-width="1.5"/>
  <rect x="384" y="238" width="15" height="12" rx="2" fill="none" stroke="#334155" stroke-width="1.4"/>
  <path d="M386.5,238 L386.5,233.5 a5,5 0 0 1 10,0 L396.5,238" fill="none" stroke="#334155" stroke-width="1.4"/>
  <text x="490" y="248" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">AWS IAM OIDC Provider</text>
  <text x="490" y="266" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">token.actions.githubusercontent.com</text>
  <text x="490" y="282" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">aud = sts.amazonaws.com</text>
  <text x="490" y="300" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">vérifie le claim "sub" du jeton</text>

  <!-- arrows triggers -> hub -->
  <path d="M230,80 L340,220" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="248" y="126" width="150" height="34" fill="#ffffff" opacity="0.92"/>
  <text x="253" y="140" font-family="sans-serif" font-size="10.5" fill="#1e293b">jeton OIDC</text>
  <text x="253" y="154" font-family="sans-serif" font-size="10.5" fill="#1e293b">sub: repo/…:pull_request</text>

  <path d="M230,440 L340,320" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="248" y="378" width="215" height="34" fill="#ffffff" opacity="0.92"/>
  <text x="253" y="392" font-family="sans-serif" font-size="10.5" fill="#1e293b">jeton OIDC</text>
  <text x="253" y="406" font-family="sans-serif" font-size="10.5" fill="#1e293b">sub: repo/…:ref:refs/heads/main</text>

  <!-- Role: plan (read-only) -->
  <rect x="700" y="20" width="240" height="140" rx="10" fill="url(#gGreen)" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="722" cy="40" r="11" fill="#15803d"/>
  <path d="M716,40 a6,4 0 0 1 12,0 a6,4 0 0 1 -12,0 z" fill="none" stroke="#f0fdf4" stroke-width="1.3"/>
  <circle cx="722" cy="40" r="1.8" fill="#f0fdf4"/>
  <text x="820" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#14532d">gha-terraform-plan</text>
  <text x="820" y="63" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">Lecture seule</text>
  <text x="820" y="83" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#365314">ec2:Describe* · iam:Get*/List*</text>
  <text x="820" y="98" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#365314">s3:Get*/List* · rds:Describe*</text>
  <text x="820" y="113" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#365314">sts:GetCallerIdentity</text>
  <text x="820" y="135" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#166534">session max 1h</text>

  <!-- Role: apply (write) -->
  <rect x="700" y="380" width="240" height="140" rx="10" fill="url(#gAmber)" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="722" cy="400" r="11" fill="#c2410c"/>
  <path d="M717,405 L727,395 M724,395 L727,395 L727,398" stroke="#fff7ed" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="406" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#7c2d12">gha-terraform-apply</text>
  <text x="820" y="423" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9a3412">Écriture</text>
  <text x="820" y="443" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">ec2:* · s3:*</text>
  <text x="820" y="458" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">rds:Create/Modify/Delete</text>
  <text x="820" y="473" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7c2d12">iam:PassRole</text>
  <text x="820" y="495" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#9a3412">session max 1h</text>

  <!-- arrows hub -> roles -->
  <path d="M610,250 L700,90" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="618" y="170" width="130" height="20" fill="#ffffff" opacity="0.92"/>
  <text x="623" y="185" font-family="sans-serif" font-size="10.5" fill="#166534">sub == pull_request ?</text>

  <path d="M610,290 L700,450" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <rect x="618" y="345" width="120" height="20" fill="#ffffff" opacity="0.92"/>
  <text x="623" y="360" font-family="sans-serif" font-size="10.5" fill="#9a3412">sub == ref:main ?</text>

  <!-- blocked path (routed through the clear band below the hub box, avoiding overlap) -->
  <path d="M230,112 C 380,340 500,350 695,440" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowRed)"/>
  <rect x="368" y="336" width="176" height="34" fill="#ffffff" opacity="0.92"/>
  <text x="456" y="349" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">✗ sub ne correspond pas</text>
  <text x="456" y="364" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">→ AssumeRole refusé</text>

  <!-- AWS resources -->
  <rect x="700" y="240" width="240" height="60" rx="10" fill="url(#gSlate)" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M726,258 a7,7 0 0 1 13,-3 a6,6 0 0 1 6,10 h-21 a5,5 0 0 1 2,-7 z" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <text x="820" y="271" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">Ressources AWS</text>
  <text x="820" y="287" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">EC2 · S3 · RDS</text>
  <path d="M820,160 L820,240" fill="none" stroke="#15803d" stroke-width="1.2" marker-end="url(#arrowGreen)"/>
  <path d="M820,380 L820,300" fill="none" stroke="#c2410c" stroke-width="1.2" marker-end="url(#arrowAmber)"/>
</svg>
