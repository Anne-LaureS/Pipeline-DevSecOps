services:
  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack
    ports:
      - "4566:4566" # port unique pour toutes les API émulées (edge)
    environment:
      - SERVICES=ec2,iam,sts,s3
      - DEBUG=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
