name: Terraform DevSecOps Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Aucune permission par défaut : chaque job déclare explicitement
# le strict nécessaire (principe du moindre privilège).
permissions: {}

# Pas de cancel-in-progress : on ne veut jamais interrompre un apply
# en cours (risque d'état Terraform corrompu / ressources orphelines).
concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "eu-west-3"

jobs:

  ##########################################################
  # JOB 1 — Qualité : fmt, gitleaks, trivy config (bloquants)
  ##########################################################
  qualite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # requis par gitleaks-action pour commenter une PR en cas de fuite
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Gitleaks (détection de secrets)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gitleaks-action retourne un code non-nul en cas de détection,
        # ce qui fait échouer le job -> bloquant par construction.
        # GITLEAKS_LICENSE non nécessaire ici : uniquement requis pour un
        # dépôt appartenant à une organisation, pas à un compte personnel.

      - name: Trivy config (misconfig IaC)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

  ##########################################################
  # JOB 2 — Plan : terraform plan + conftest + commentaire PR
  #
  # NB pédagogique : faute de compte AWS fourni, ce job tourne contre
  # LocalStack (émulation locale, aucune donnée/coût réel) plutôt que
  # d'assumer le rôle OIDC gha-terraform-plan. La logique OIDC réelle
  # (terraform/oidc.tf) reste écrite, commentée et revue, mais n'est
  # PAS exercée en conditions live ici — assumé comme limite explicite
  # en partie D du rapport (IAM non testé en conditions réelles).
  ##########################################################
  plan:
    needs: qualite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform/examples
        run: terraform init -input=false

      - name: Terraform plan (contre LocalStack)
        working-directory: terraform/examples
        run: |
          terraform plan -input=false -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Setup conftest
        run: |
          CONFTEST_VERSION="0.55.0"
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" -o conftest.tar.gz
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Policy as code (conftest / OPA)
        working-directory: terraform/examples
        run: conftest test tfplan.json --policy ../../policies

      - name: Upload plan artifact (pour le job apply)
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: tfplan
          path: terraform/examples/tfplan.binary
          retention-days: 1

      - name: Publier le plan en commentaire de PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/examples/tfplan.txt', 'utf8').slice(0, 60000);
            const body = `### Terraform Plan\n<details><summary>Afficher le plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  ##########################################################
  # JOB 4 — Apply : uniquement sur main, environment protégé
  # (approbation manuelle configurée côté GitHub Settings >
  # Environments > production > Required reviewers)
  #
  # NB pédagogique : comme le job plan, tourne contre LocalStack faute
  # de compte AWS fourni. Le rôle OIDC gha-terraform-apply n'est donc
  # pas exercé ici non plus — cf. note du job plan et partie D du
  # rapport. Sur un vrai compte AWS, il suffirait de remplacer le
  # service localstack + provider.tf/examples par le provider.tf
  # "réel" (endpoints AWS standards) et de réactiver l'étape
  # configure-aws-credentials ci-dessous (laissée en commentaire).
  ##########################################################
  apply:
    needs: qualite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --- Sur un vrai compte AWS, remplacer le bloc "services" et le
      # provider LocalStack par ceci, et décommenter :
      # - name: Configure AWS credentials (rôle apply, écriture)
      #   uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
      #   with:
      #     role-to-assume: arn:aws:iam::ACCOUNT_ID:role/gha-terraform-apply
      #     aws-region: ${{ env.AWS_REGION }}
      # et donner à ce job "permissions: id-token: write" en plus de contents: read.

      - name: Terraform init
        working-directory: terraform/examples
        run: terraform init -input=false

      # NB : ce job ne re-télécharge PAS l'artefact "tfplan" du job plan
      # car plan/apply s'exécutent sur deux événements différents
      # (pull_request vs push sur main), donc deux runs distincts.
      # Dans un modèle "merge queue" ou "trunk-based avec plan sur main"
      # plus strict, on ferait tourner plan ET apply dans le MÊME run
      # déclenché par le push sur main, et apply téléchargerait alors
      # l'artefact produit par plan dans ce run — voir note rapport
      # partie D sur ce risque résiduel (dérive plan/apply).
      - name: Terraform apply (contre LocalStack)
        working-directory: terraform/examples
        run: terraform apply -input=false -auto-approve